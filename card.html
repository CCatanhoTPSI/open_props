<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/open-props.min.css"
    />
    <style>
      .card-wrapper {
        container-name: abc;
        container-type: inline-size;
      }
      @container abc (width < 500px) {
        .card {
          display: flex;
          flex-direction: row;
        }
        img {
          width: 40%;

        }
      }
    </style>
  </head>
  <body>
    <h1>Titulo da nossa página</h1>
    <div class="card-wrapper">
      <div class="card">
        <p class="openpropsfont">
          This is simple card component using Open Props.
        </p>
          <img src="img/images.jfif" />
      </div>
    </div>
  </body>
</html>
