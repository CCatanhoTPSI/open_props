<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/open-props.min.css"
    />
    <style>
        /* Size open props */
      .card {
        border: solid var(--border-size-5);
        background-color: var(--surface-6);
        padding: var(--size-2);
        box-shadow: var(--shadow-4);
        max-width: 400px;
        margin-left: var(--size-px-4);
        margin-right: var(--size-px-4);
        margin-top: 20px;
        margin-bottom: 20px;        
      }
      /*  */
      .openpropsfont {
        font-family: var(--font-antique);
        font-size: var(--font-size-3);
        color: var(--text-1);
      }
      .card-container {
        display: flex;
        flex-direction: row;
      }
      .footer {
        background-color: var(--surface-3);
        padding: var(--size-2);
        text-align: center;
        margin-top: var(--size-7);
      }
    </style>
  </head>
  <body>
        <h1>Titulo da nossa página</h1>
        <div class="card-container">
                <div class="card">
                    <p class="openpropsfont">This is simple card component using Open Props.</p>
                </div>
                <div class="card">

                </div>
                <div class="card">
                    <p class="openpropsfont">This is simple card component using Open Props.</p>
                </div>
            </div>
        </div>
        <footer>
            <p class="openpropsfont">© 2026 My Website. All rights reserved.</p>
        </footer>

</html>
