<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/open-props.min.css"
    />
    <style>
      .card {
        border: 1px solid rgb(135, 131, 131);
        border-radius: 15px;
        background-color: rgb(120, 5, 93);
        padding: 5px;
        margin: 10px;
        max-width: 400px;
        font-style: italic;
        color: white;
      }
      .layout {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      img {
        width: 60px;
        height: 60px;
        border-radius: 60%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="layout">
        <img src="./img/image-daniel.jpg" />
        <div>
          <p>Daniel Clifford</p>
          <p>Verified Graduate</p>
        </div>
      </div>
      <p>
        I received a job offer mid-course, and the subjects I learned were
        current, if not more so, in the company I joined. I honestly feel I got
        every penny’s worth.
      </p>
    </div>
  </body>
</html>
